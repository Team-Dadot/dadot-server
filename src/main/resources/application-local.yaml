spring:
  config:
    import: "optional:file:./.env[.properties]"

  datasource:
    url: "jdbc:mariadb://127.0.0.1:${DB_PORT:3307}/${DB_NAME:dadot_db}"
    username: ${DB_USERNAME:dadot_app}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

springdoc:
  api-docs:
    enabled: true

  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    persist-authorization: false

app:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173