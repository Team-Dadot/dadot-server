global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: dadot-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - app:8081

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090