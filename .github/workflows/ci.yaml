name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SPRING_PROFILES_ACTIVE: test
      TEST_DB_URL: jdbc:mariadb://127.0.0.1:3308/dadot_test_db
      TEST_DB_USERNAME: dadot_test
      TEST_DB_PASSWORD: ci_only_password

    services:
      mariadb:
        image: mariadb:11.8.9

        env:
          MARIADB_DATABASE: dadot_test_db
          MARIADB_USER: dadot_test
          MARIADB_PASSWORD: ci_only_password
          MARIADB_ROOT_PASSWORD: ci_only_root_password

        ports:
          - 3308:3306

        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew clean check --no-daemon

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-and-coverage-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/
            build/reports/jacoco/test/
          if-no-files-found: warn
          retention-days: 14