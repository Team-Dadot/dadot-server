language: ko-KR
early_access: false
enable_free_tier: true

tone_instructions: |
  간결한 한국어로 리뷰하세요. 문제의 발생 조건·영향·최소 수정 방향만 설명하세요.
  코드 예시가 필요하면 Java로 작성하세요.

reviews:
  profile: quiet
  request_changes_workflow: true

  high_level_summary: false
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  poem: false
  in_progress_fortune: false
  collapse_walkthrough: true
  abort_on_close: true

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - ".*"

  path_filters:
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!**/gradle-wrapper.jar"

  path_instructions:
    - path: "**/*"
      instructions: |
        - 확인 가능한 버그와 보안·데이터 손실 위험에 집중하세요.
        - 비밀번호·API 키·토큰·인증번호의 코드, 설정, 로그 노출을 확인하세요.
        - 인증 우회, 권한·소유권 누락, 입력값 검증 누락과 인젝션을 확인하세요.
        - 중복 실행, 동시성, 트랜잭션 롤백과 파괴적인 DB 변경을 확인하세요.
        - 실제 장애로 이어지는 성능 문제만 지적하세요.
        - 포맷, 이름 취향, 단순 주석, 불필요한 리팩터링 제안은 생략하세요.
        - PR 범위 밖의 미구현 기능이나 확인되지 않은 명세를 요구하지 마세요.
        - 의도된 정책은 코드·테스트·저장소 문서를 확인한 후 판단하세요.
        - 같은 문제는 반복하지 말고 한 번만 설명하세요.

  tools:
    gitleaks:
      enabled: true
    semgrep:
      enabled: true
    github-checks:
      enabled: true
    markdownlint:
      enabled: false
    yamllint:
      enabled: false
    languagetool:
      enabled: false

chat:
  auto_reply: true
  art: false

knowledge_base:
  learnings:
    scope: local
  issues:
    scope: local