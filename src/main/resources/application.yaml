spring:
  application:
    name: dadot-server

  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        type:
          java_time_use_direct_jdbc: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

  sql:
    init:
      mode: never

  jackson:
    time-zone: UTC
    default-property-inclusion: always

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  paths-to-match:
    - /v1/**
  override-with-generic-response: false

app:
  apple:
    team-id: ${APPLE_TEAM_ID:}
    client-id: ${APPLE_CLIENT_ID:}
    key-id: ${APPLE_KEY_ID:}
    private-key-path: ${APPLE_PRIVATE_KEY_PATH:}
  kakao:
    app-id: ${KAKAO_APP_ID:0}
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}

  links:
    privacy-policy-url: ${PRIVACY_POLICY_URL}
    inquiry-form-url: ${INQUIRY_FORM_URL}

  auth-proof:
    encryption-key-base64: ${AUTH_PROOF_ENCRYPTION_KEY}

  email-verification:
    hmac-secret-base64: ${AUTH_VERIFICATION_HMAC_SECRET}
    from-address: ${MAIL_FROM}
    ip-per-minute: 10
    ip-per-hour: 50

  cors:
    allowed-origins: []

logging:
  level:
    root: INFO
    org.hibernate.orm.connections.pooling: WARN