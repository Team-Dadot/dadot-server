language: ko-KR
early_access: false
enable_free_tier: true

tone_instructions: |
  간결한 한국어로 리뷰하세요. 문제의 발생 조건·영향·코드 근거·최소 수정 방향을 설명하세요.
  코드 예시가 필요하면 Java로 작성하세요.

reviews:
  profile: assertive
  request_changes_workflow: true

  high_level_summary: false
  changed_files_summary: false
  sequence_diagrams: true
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  poem: false
  in_progress_fortune: false
  collapse_walkthrough: true
  abort_on_close: true

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - ".*"

  path_filters:
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!**/gradle-wrapper.jar"

  path_instructions:
    - path: "**/*"
      instructions: |
        - 확인 가능한 버그와 보안·데이터 손실·데이터 불일치 위험에 집중하세요.
        - 변경된 코드의 호출 경로와 관련 서비스·저장소·DB 제약·설정을 함께 확인하세요. 관련 코드는 변경 파일 밖에서도 확인하되, 지적은 이번 변경으로 발생하거나 영향을 받는 문제에 한정하세요.
        - 비밀번호·API 키·토큰·인증번호와 개인정보가 코드·설정·로그·응답에 노출되는지 확인하세요.
        - 인증 우회, 권한·소유권 검증 누락, 세션 무효화 누락과 사용자 간 데이터 접근 가능성을 확인하세요.
        - 입력값의 누락·형식·범위·길이·허용 상태와 인젝션·경로 조작·외부 요청 대상 검증을 확인하세요.
        - 동일 요청의 재전송, 멱등성 키 재사용, 동시 실행과 재시도에서 중복 처리나 결과 불일치가 발생하는지 확인하세요.
        - 트랜잭션 범위·격리 수준·잠금 순서·유일 제약을 함께 확인하고, 경쟁 조건·교착 상태·갱신 유실 가능성을 검토하세요.
        - 처리 중간의 예외·시간 초과·외부 시스템 실패 시 부분 저장이나 상태 불일치가 남는지 확인하세요.
        - 비동기 작업의 중복 실행·중단·재시도·복구 과정에서 상태와 결과가 일관되는지 확인하세요.
        - 날짜·시간대·자정 경계, 빈 결과, 최솟값·최댓값과 상태 전환의 경계 조건을 확인하세요.
        - API 요청·응답·오류 코드와 기존 호출자의 호환성을 확인하고, 응답에 불필요한 민감 정보가 포함되는지 검토하세요.
        - DB 변경의 기존 데이터 호환성, 기본값·NULL·인덱스·외래 키와 데이터 손실 가능성을 확인하세요.
        - 반복문 내부의 DB·외부 API 호출, 무제한 조회·응답·파일 처리와 데이터 증가에 따른 쿼리 수·메모리 사용 증가를 확인하세요.
        - 성능 지적은 코드로 확인되는 구조적 문제와 발생 조건을 제시하세요. 측정이 필요한 추정은 확정된 결함으로 표현하지 말고, 근거 없는 배치 크기·풀 크기·타임아웃 변경은 요구하지 마세요.
        - 관련 테스트가 정상 흐름뿐 아니라 권한·경계 조건·중복 요청·동시 실행·실패 시 롤백을 검증하는지 확인하세요. 테스트 추가는 변경 위험과 직접 관련된 경우에만 제안하세요.
        - 기능별 정책은 현재 코드·테스트·저장소 명세를 확인한 후 판단하세요. 근거가 충돌하거나 부족하면 임의로 정책을 정하지 말고 불확실한 점을 명시하세요.
        - 포맷, 이름 취향, 단순 주석, 불필요한 추상화·리팩터링과 특정 기술로의 전환 제안은 생략하세요.
        - PR 범위 밖의 미구현 기능이나 확인되지 않은 명세를 요구하지 마세요.
        - 각 지적에는 구체적인 발생 조건·영향·코드 근거·최소 수정 방향을 포함하고, 같은 원인의 문제는 대표 위치에 한 번만 설명하세요.

  tools:
    gitleaks:
      enabled: true
    semgrep:
      enabled: true
    github-checks:
      enabled: true
    markdownlint:
      enabled: false
    yamllint:
      enabled: false
    languagetool:
      enabled: false

chat:
  auto_reply: true
  art: false

knowledge_base:
  learnings:
    scope: local
  issues:
    scope: local