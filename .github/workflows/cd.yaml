name: CD

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: dadot-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'Team-Dadot/dadot-server'
      && github.ref == 'refs/heads/main'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.path == '.github/workflows/ci.yaml'
      && (github.event.workflow_run.event == 'push'
          || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Check out the commit that passed CI
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Check deployment variables
        shell: bash
        run: |
          set -euo pipefail
          test "$AWS_REGION" = ap-northeast-2
          test "$AWS_ROLE_ARN" = arn:aws:iam::454331167410:role/dadot-github-deploy-role
          test "$EC2_INSTANCE_ID" = i-06a6741c6bd94dc87
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          bash -n deploy/configure.sh deploy/start.sh deploy/release.sh
          node --check deploy/ssm-deploy.mjs

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the JAR from the tested commit
        run: ./gradlew bootJar --no-daemon

      - name: Set image tag
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="$image:sha-$RELEASE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'name=%s\ntag=%s\n' "$image" "$tag" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          pull: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/Team-Dadot/dadot-server
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}

      - name: Confirm this is still the latest main commit
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.repos.getBranch({
              ...context.repo,
              branch: 'main',
            });
            if (data.commit.sha !== process.env.RELEASE_SHA) {
              core.setFailed('main에 더 최신 커밋이 있어 이전 커밋의 배포를 중단합니다.');
            }

      - name: Get temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: '454331167410'
          role-session-name: dadot-cd-${{ github.run_id }}

      - name: Deploy through SSM and wait for the result
        env:
          DADOT_IMAGE: ${{ steps.image.outputs.name }}@${{ steps.publish.outputs.digest }}
        run: node deploy/ssm-deploy.mjs